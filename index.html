<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일출 · 일몰 시각</title>
  <style>
    :root {
      --bg1: #1d2b53; --bg2: #f6a56b;
      --card: rgba(255, 255, 255, 0.92);
      --ink: #1f2430; --muted: #6b7280;
      --sun: #e8743b; --moon: #3b4f8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg1) 0%, #6b5b95 55%, var(--bg2) 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 560px; flex: 1; }
    h1 { color: #fff; text-align: center; font-size: 1.8rem; margin: 8px 0 4px; letter-spacing: -0.02em; }
    .date { color: rgba(255,255,255,0.85); text-align: center; margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
    label { font-weight: 600; font-size: 0.95rem; }
    select {
      display: block; width: 100%; margin-top: 8px; padding: 10px 12px;
      font-size: 1.05rem; border-radius: 10px; border: 1px solid #cfd3dc; background: #fff;
    }
    .times { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .time { text-align: center; padding: 20px 8px; border-radius: 16px; background: #fff7f0; }
    .time.set { background: #eef1fb; }
    .time .label { font-size: 0.95rem; color: var(--muted); }
    .time .value {
      font-size: clamp(2.6rem, 11vw, 3.6rem); font-weight: 800;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 4px;
    }
    .time.rise .value { color: var(--sun); }
    .time.set .value { color: var(--moon); }
    .time .sub { margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
    .time .sub b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
    .status { margin-top: 20px; text-align: center; color: var(--muted); min-height: 1.4em; }
    .status.error { color: #b42318; background: #fef3f2; border-radius: 10px; padding: 12px; }
    footer { margin-top: 28px; color: rgba(255,255,255,0.9); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>일출 · 일몰 시각</h1>
    <p class="date" id="date"></p>

    <div class="card">
      <label for="location">지역</label>
      <select id="location">
        <option>서울</option><option>강릉</option><option>속초</option>
        <option>포항</option><option>울산</option><option>부산</option>
        <option>제주</option><option>독도</option><option>여수</option>
        <option>대전</option>
      </select>

      <div class="times">
        <div class="time rise">
          <div class="label">🌅 해 뜨는 시각</div>
          <div class="value" id="sunrise">--:--</div>
          <div class="sub">하늘이 밝아지는 시각 <b id="civilm">--:--</b></div>
        </div>
        <div class="time set">
          <div class="label">🌇 해 지는 시각</div>
          <div class="value" id="sunset">--:--</div>
          <div class="sub">하늘이 어두워지는 시각 <b id="civile">--:--</b></div>
        </div>
      </div>

      <p class="status" id="status" role="status"></p>
    </div>
  </main>

  <footer>자료: 한국천문연구원 · 공공데이터포털</footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ['sunrise', 'sunset', 'civilm', 'civile'];

    // 한국 시간 기준 오늘
    const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
    const y = kst.getUTCFullYear();
    const m = String(kst.getUTCMonth() + 1).padStart(2, '0');
    const d = String(kst.getUTCDate()).padStart(2, '0');
    const today = `${y}${m}${d}`;
    const weekday = '일월화수목금토'[kst.getUTCDay()];
    $('date').textContent = `${y}년 ${Number(m)}월 ${Number(d)}일 (${weekday}) · 한국 시간 기준`;

    // 마지막으로 고른 지역 기억
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    const saved = store.get('location');
    if (saved) $('location').value = saved;

    function setStatus(text, isError) {
      $('status').textContent = text;
      $('status').className = 'status' + (isError ? ' error' : '');
    }

    async function load() {
      const location = $('location').value;
      store.set('location', location);
      fields.forEach((f) => ($(f).textContent = '--:--'));
      setStatus('불러오는 중…');

      try {
        const res = await fetch(`/api/sunrise?location=${encodeURIComponent(location)}&date=${today}`);
        let data;
        try { data = await res.json(); } catch { data = null; }

        if (!res.ok || !data) {
          throw new Error(
            (data && data.error) ||
            (res.status === 404 ? '서버 함수(/api/sunrise)를 찾을 수 없습니다. vercel dev 또는 배포 환경에서 열어 주세요.'
                                : `서버 오류가 발생했습니다. (${res.status})`)
          );
        }
        fields.forEach((f) => ($(f).textContent = data[f] || '--:--'));
        setStatus('');
      } catch (e) {
        const msg = e instanceof TypeError
          ? '네트워크에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'
          : e.message;
        setStatus('⚠️ ' + msg, true);
      }
    }

    $('location').addEventListener('change', load);
    load();
  </script>
</body>
</html>
